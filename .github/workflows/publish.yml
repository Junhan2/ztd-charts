# Pushing a version tag (e.g. v0.7.1) publishes ztd-charts, ztd-charts-cli and ztd-charts-mcp to npm.
# It uses npm trusted publishing (OIDC), so there is no stored token and no one has to click an approval link.
# The tag must match the version in the three package.json files, and the same checks as CI must pass first.
# Run by hand from the Actions tab, it takes the same steps but ends with npm publish --dry-run, so nothing is sent.
# On npmjs.com, each of the three packages must have Junhan2, ztd-charts, publish.yml registered as its trusted publisher, with npm publish allowed.
#
# build installs the packages and runs the checks without publish rights. Only publish can request an npm token,
# and publish runs no outside code: it takes the files build packed (tarballs) and publishes them as they are.
# Every action is pinned to a commit, so a moved or stolen tag cannot run new code here.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Publish one version at a time: a second tag waits until the first one finishes
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, checks and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version is read from packageManager in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 26: the same version as CI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # The publish build uses no cache, so a poisoned cache cannot reach what gets published
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The three packages always share one version. When the run starts from a tag, that version must also match the tag
      - name: The three packages share one version, and the tag names it
        run: |
          expected=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          for dir in packages/ztd-charts packages/cli packages/mcp; do
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$version" != "${expected:-$version}" ]; then
              echo "::error::$dir is at $version, expected $expected"
              exit 1
            fi
            expected="$version"
          done
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm size
      # The build rewrites packages/ztd-charts/schema, which is committed, so no file may be changed after the build
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::Generated files are out of date. Run pnpm build, then commit the changes."
            exit 1
          fi
      # pnpm pack replaces workspace:* with that version number when it packs. If any is left, the package cannot be installed, so stop here
      - name: Pack the three packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          for dir in packages/ztd-charts packages/cli packages/mcp; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          done
          for tarball in "$GITHUB_WORKSPACE"/tarballs/*.tgz; do
            if tar -xOf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$(basename "$tarball") still has a workspace: dependency"
              exit 1
            fi
          done
          ls -l "$GITHUB_WORKSPACE/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # Wait up to 15 minutes per package until it shows on npm. For 0.7.0, the three together would have taken about 10 minutes
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Publish the library first, because the CLI and MCP need the library of the same version.
      # npm shows a version only a few minutes after accepting it (for 0.7.0: 4 min 10 s for the library, 1 min 16 s for MCP).
      # So wait until the published version shows on npm before publishing the next package. Without the wait, MCP shows first and installs break in the meantime.
      # Versions already on npm are skipped, so a run that stopped halfway can be rerun,
      # and a manual run on an already published version does not fail (npm rejects even --dry-run for a published version)
      - name: Publish, or only try it on a manual run
        run: |
          echo "npm $(npm --version)"
          on_npm() { [ -n "$(npm view "$1" version --prefer-online 2>/dev/null)" ]; }
          for name in ztd-charts ztd-charts-cli ztd-charts-mcp; do
            tarball=$(ls "$name"-[0-9]*.tgz)
            version=${tarball#"$name"-}
            version=${version%.tgz}
            if on_npm "$name@$version"; then
              echo "::notice::$name@$version is already on npm, skipped"
            elif [ "$GITHUB_EVENT_NAME" = push ]; then
              npm publish "$tarball"
              waited=0
              until on_npm "$name@$version"; do
                if [ "$waited" -ge 900 ]; then
                  echo "::error::npm accepted $name@$version but still does not show it after 15 minutes"
                  exit 1
                fi
                sleep 15
                waited=$((waited + 15))
              done
              echo "$name@$version is visible on npm after about ${waited}s"
            else
              npm publish "$tarball" --dry-run
            fi
          done
