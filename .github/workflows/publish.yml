# 버전 태그(예: v0.7.1)를 올리면 ztd-charts, ztd-charts-cli, ztd-charts-mcp 를 npm 에 게시해요.
# npm 의 trusted publishing(OIDC)을 써서 저장해 둔 토큰이 없고, 사람이 승인 링크를 누를 일도 없어요.
# 태그는 세 package.json 의 버전과 같아야 하고, CI 와 같은 검사를 먼저 통과해야 해요.
# Actions 탭에서 손으로 돌리면 같은 순서를 밟되 npm publish --dry-run 으로 끝나서 아무것도 보내지 않아요.
# npmjs.com 에는 세 패키지마다 trusted publisher 로 Junhan2, ztd-charts, publish.yml 을 등록하고 npm publish 를 허용해 둬야 해요.
#
# build 는 게시 권한 없이 패키지를 설치하고 검사를 돌려요. npm 토큰을 요청할 수 있는 것은 publish 뿐이고,
# publish 는 외부 코드를 돌리지 않아요: build 가 묶어 둔 파일(tarball)을 받아 그대로 게시해요.
# 액션은 모두 커밋으로 고정해서, 태그가 옮겨지거나 도용돼도 여기서 새 코드가 돌지 않아요.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 한 번에 한 버전만 게시해요: 두 번째 태그는 첫 번째가 끝날 때까지 기다려요
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build, checks and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 판은 package.json 의 packageManager 에서 읽어요
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 26: CI 와 같은 판이에요
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # 게시용 빌드는 캐시를 쓰지 않아요. 오염된 캐시가 게시물에 닿지 않게요
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # 세 패키지는 늘 같은 버전이에요. 태그로 시작했으면 그 버전이 태그와도 같아야 해요
      - name: The three packages share one version, and the tag names it
        run: |
          expected=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          for dir in packages/ztd-charts packages/cli packages/mcp; do
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$version" != "${expected:-$version}" ]; then
              echo "::error::$dir is at $version, expected $expected"
              exit 1
            fi
            expected="$version"
          done
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm size
      # 빌드가 다시 쓰는 packages/ztd-charts/schema 는 커밋하는 파일이라, 빌드 뒤에도 바뀐 파일이 없어야 해요
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::Generated files are out of date. Run pnpm build, then commit the changes."
            exit 1
          fi
      # pnpm pack 은 workspace:* 를 그 버전 숫자로 바꿔서 묶어요. 하나라도 남아 있으면 설치가 안 되는 패키지라 여기서 멈춰요
      - name: Pack the three packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tarballs"
          for dir in packages/ztd-charts packages/cli packages/mcp; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          done
          for tarball in "$GITHUB_WORKSPACE"/tarballs/*.tgz; do
            if tar -xOf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$(basename "$tarball") still has a workspace: dependency"
              exit 1
            fi
          done
          ls -l "$GITHUB_WORKSPACE/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # 라이브러리를 먼저 올려요. CLI 와 MCP 가 같은 버전의 라이브러리를 필요로 해서요.
      # 이미 npm 에 있는 버전은 건너뛰어요. 그래서 중간에 멈춘 실행을 다시 돌려도 되고,
      # 이미 게시된 버전에서 손으로 돌려도 실패하지 않아요(npm 은 게시된 버전의 --dry-run 도 거절해요)
      - name: Publish, or only try it on a manual run
        run: |
          echo "npm $(npm --version)"
          for name in ztd-charts ztd-charts-cli ztd-charts-mcp; do
            tarball=$(ls "$name"-[0-9]*.tgz)
            version=${tarball#"$name"-}
            version=${version%.tgz}
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "::notice::$name@$version is already on npm, skipped"
            elif [ "$GITHUB_EVENT_NAME" = push ]; then
              npm publish "$tarball"
            else
              npm publish "$tarball" --dry-run
            fi
          done
