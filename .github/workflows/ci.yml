# PR 마다 라이브러리, CLI, MCP 를 검사해요: 빌드, 타입, 린트, 단위 테스트, 번들 크기 예산, 빌드가 다시 쓰는 파일이 커밋돼 있는지
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR(또는 main)에 새로 올리면 돌던 검사는 멈춰요
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 판은 package.json 의 packageManager 에서 읽어요
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 26: vitest 5, tsup 9, size-limit 14 가 Node 22.19, 24.11, 26 이상을 요구해요(package.json engines 의 20.19 보다 높아요)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm size
      # 빌드가 다시 쓰는 packages/ztd-charts/schema 는 커밋하는 파일이라, 빌드 뒤에도 바뀐 파일이 없어야 해요
      - name: Generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::Generated files are out of date. Run pnpm build, then commit the changes."
            exit 1
          fi
